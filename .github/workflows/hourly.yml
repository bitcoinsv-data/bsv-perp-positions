name: Hourly positions

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      watch_minutes:
        description: "Minutes to listen to BSV trades before the sweep"
        default: "20"

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: positions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Previous file (publish guard and leverage tiers)
        run: curl -sf https://bitcoinsv-data.github.io/bsv-perp-positions/bsv-positions.json -o data/bsv-positions.json || true

      - name: Listen to BSV trades
        run: python watch_addresses.py --minutes "${{ github.event.inputs.watch_minutes || '20' }}" || true

      - name: Sweep positions
        run: python collect_positions.py

      - name: Save newly seen addresses
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen-addresses.txt
          if ! git diff --cached --quiet; then
            git commit -m "Seen addresses"
            git pull --rebase
            git push
          fi

      - name: Stage the published file
        run: |
          mkdir -p public
          cp data/bsv-positions.json public/
          touch public/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Wait until the artifact is listed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          seen=0
          for i in $(seq 1 90); do
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" --jq .total_count 2>/dev/null || true)
            case "$n" in ''|*[!0-9]*) n=0 ;; esac
            if [ "$n" -ge 1 ]; then seen=$((seen + 1)); else seen=0; fi
            if [ "$seen" -ge 2 ]; then echo "Artifact listed after $(( (i - 1) * 2 )) s"; exit 0; fi
            sleep 2
          done
          echo "Artifact not listed after 180 s, trying the deploy anyway"

      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Pause before the second try
        if: steps.deploy.outcome == 'failure'
        run: sleep 60

      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
